<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboards</title>
<style>
:root { --bg:#f6f6f4; --card:#fff; --fg:#1b1b1a; --muted:#6b6b66; --line:#e3e3df; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#141413; --card:#1f1f1d; --fg:#ededea; --muted:#9b9b95; --line:#30302d; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:24px; margin:0 0 16px; }
.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-bottom:10px; color:inherit; text-decoration:none; }
.t { display:block; font-weight:600; }
.u, .empty, footer { color:var(--muted); font-size:14px; }
footer { margin-top:24px; }
</style></head>
<body><main>
<h1>Dashboards</h1>
<a class="card" href="sofia/"><span class="t">Sofía — Oficialmente Molesta en la Feria</span><span class="u">Updated 25 Nov 2026, 22:03</span></a>
<footer>Times are Mexico City.</footer>
</main></body></html>
